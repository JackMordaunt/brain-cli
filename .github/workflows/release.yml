# Builds the static binary for each platform on every push and, on a version
# tag, publishes them with a sha256sums.txt, which is what install.sh and
# install.ps1 download, and beside each asset its zstd-compressed form and
# a patch to it from each of the last PATCH_FROM releases, which is what
# `brain update` downloads when it can (jm/selfupdate, jm/tools/mkpatch).
#
# Versions are calendar tags the way Odin's are: dev-YYYY-MM, with a letter
# for a second release in a month (dev-2026-09a). dev-YYYY-MM-rcN is a
# release candidate, published as a prerelease, so releases/latest and
# `brain update` never offer it; BRAIN_VERSION=<tag> installs it.
name: release

on:
  push:
    branches: ["**"]
    tags: ["dev-*"]
  workflow_dispatch:

# CI builds the Odin compiler brainfold is developed with, not a release:
# the commit is tagged in the fork (setup-odin clones a branch or tag, never
# a bare commit), and LLVM matches the local build's major version. Moving
# to a newer Odin is: tag the new commit brainfold-pin-<short sha> in the
# fork, and change ODIN_PIN.
env:
  ODIN_REPO: https://github.com/JackMordaunt/Odin
  ODIN_PIN: brainfold-pin-984eb69e0
  ODIN_LLVM: "22"
  # How many earlier releases a tag publishes patches from. Prereleases
  # count too: a machine on an rc updates by patch like any other.
  PATCH_FROM: "3"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux_amd64
            asset: brain-linux-amd64
          - os: ubuntu-24.04-arm
            target: linux_arm64
            asset: brain-linux-arm64
          - os: macos-latest
            target: darwin_arm64
            asset: brain-darwin-arm64
          # Intel macOS is cross-compiled on the arm64 runner: the SQLite
          # archive is built with -arch x86_64 and Odin links for the target.
          - os: macos-latest
            target: darwin_amd64
            asset: brain-darwin-amd64
            cc: cc -arch x86_64
          - os: windows-latest
            target: windows_amd64
            asset: brain-windows-amd64.exe
    runs-on: ${{ matrix.os }}
    steps:
      # jm is a submodule, pinned to the commit local builds use.
      - uses: actions/checkout@v4
        with:
          submodules: true
      # Before Odin: build.bat compiles it with MSVC.
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
        if: runner.os == 'Windows'
      - uses: laytan/setup-odin@8536d8fa450ec6f1bd9ddc84bbaaf16296c0051d # v2.12.2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ env.ODIN_REPO }}
          branch: ${{ env.ODIN_PIN }}
          release: ""
          llvm-version: ${{ env.ODIN_LLVM }}
          build-type: release
      - uses: extractions/setup-just@f8a3cce218d9f83db3a2ecd90e41ac3de6cdfd9b # v3
        with:
          just-version: "1.58.0"

      # jm:http links the system libcurl, so the link needs its dev symlink.
      - name: curl link deps (linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libcurl4-openssl-dev
      # jm:sqlite3 and jm:zstd link archives built from vendored
      # amalgamations with jm's own compile options; its recipes build them
      # on Unix.
      - name: sqlite and zstd archives
        if: runner.os != 'Windows'
        shell: bash
        run: cd jm && CC="${{ matrix.cc || 'cc' }}" just sqlite zstd
      # jm's Windows recipe is written for PowerShell; the same defines are
      # read out of its justfile text and given to cl directly. Not
      # `just --evaluate`: on Windows, just 1.4x refuses the whole file over
      # a recipe whose dependency is unix-only.
      - name: sqlite and zstd archives (windows)
        if: runner.os == 'Windows'
        shell: bash
        # Git Bash rewrites a /flag into C:/Program Files/Git/flag before
        # cl sees it, hence the dash flags and no path conversion at all.
        env:
          MSYS_NO_PATHCONV: 1
        run: |
          defines=$(sed -n '/^sqlite_defines :=/,/[^\\]$/p' jm/justfile | grep -o '"[^"]*"' | tr -d '"' | tr -d '\n')
          echo "defines: $defines"
          cd jm && mkdir -p sqlite3/lib zstd/lib
          cl -nologo -O2 -c sqlite3/vendor/sqlite3.c -Fosqlite3/lib/sqlite3.obj $defines
          lib -nologo -OUT:sqlite3/lib/sqlite3.lib sqlite3/lib/sqlite3.obj
          cl -nologo -O2 -c zstd/vendor/zstd.c -Fozstd/lib/zstd.obj
          lib -nologo -OUT:zstd/lib/zstd.lib zstd/lib/zstd.obj

      # A tag build carries its version; any other build is "dev" and will
      # not update itself.
      - name: build
        shell: bash
        run: |
          mkdir -p build/release
          version=""
          case "$GITHUB_REF" in refs/tags/*) version="-define:VERSION=$GITHUB_REF_NAME" ;; esac
          odin build . -o:speed -vet -strict-style -collection:jm="$PWD/jm" $version \
            -define:COMMIT="\"${GITHUB_SHA::7}\"" \
            -target:${{ matrix.target }} -out:build/release/${{ matrix.asset }}
      - name: smoke test
        if: matrix.target != 'darwin_amd64'
        shell: bash
        run: |
          build/release/${{ matrix.asset }} version
          build/release/${{ matrix.asset }} help | head -1
          if [ "$RUNNER_OS" = Linux ]; then
            ldd build/release/${{ matrix.asset }}
          fi
          BRAIN_VAULT=testdata/vault BRAIN_STATE="$RUNNER_TEMP/state" build/release/${{ matrix.asset }} find sqlite
      # The package's tests and the installer tests, as `just test` runs them
      # locally, on every runner that can run what it builds. The publish job
      # needs every build, so a tag whose tests fail never ships. Windows runs
      # them without the address sanitizer: its HeapSize hook aborts inside
      # combase.dll and windows.storage.dll, on memory Windows allocated
      # itself (run 36725142759).
      - name: test
        if: matrix.target != 'darwin_amd64'
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Windows ]; then export SAN=; fi
          just test
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.asset }}
          path: build/release/${{ matrix.asset }}
          if-no-files-found: error
      # jm's mkpatch, built once for the publish runner, which has no Odin
      # of its own; it links the zstd archive built above.
      - name: mkpatch
        if: matrix.target == 'linux_amd64'
        shell: bash
        run: odin build jm/tools/mkpatch -o:speed -vet -strict-style -collection:jm="$PWD/jm" -out:build/release/mkpatch
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: matrix.target == 'linux_amd64'
        with:
          name: mkpatch
          path: build/release/mkpatch
          if-no-files-found: error

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      # Beside each asset, mkpatch writes its zstd-compressed form and a
      # patch to it from the same asset in each of the last PATCH_FROM
      # releases, named <asset>.<old sha256>.patch so a binary finds the
      # one for itself by its own hash; it skips a patch that would not
      # beat the compressed asset. The old builds are the published files,
      # since a rebuild is not the same bytes. A release with no earlier
      # one ships the compressed assets alone.
      - name: compressed assets and patches
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mv assets/mkpatch mkpatch && chmod +x mkpatch
          mapfile -t tags < <(gh release list -R "$GITHUB_REPOSITORY" --limit 50 --json tagName --jq '.[].tagName' | grep -vx "$GITHUB_REF_NAME" | head -n "$PATCH_FROM")
          echo "patches from: ${tags[*]:-none}"
          for tag in "${tags[@]}"; do
            mkdir -p "old/$tag"
            gh release download "$tag" -R "$GITHUB_REPOSITORY" -D "old/$tag" -p 'brain-*' || true
            rm -f old/"$tag"/*.patch old/"$tag"/*.zst
          done
          for new in assets/brain-*; do
            name=$(basename "$new")
            olds=()
            for tag in "${tags[@]}"; do [ -f "old/$tag/$name" ] && olds+=(-old "old/$tag/$name"); done
            ./mkpatch -new "$new" -out assets "${olds[@]}"
          done
      - run: cd assets && sha256sum brain-* > sha256sums.txt && cat sha256sums.txt
      # The checksum file is signed with the key whose public half the
      # binary embeds; selfupdate trusts nothing that does not verify.
      - name: sign
        env:
          KEY: ${{ secrets.BRAIN_SIGNING_KEY }}
        run: |
          printf '%s\n' "$KEY" > key.pem
          openssl pkeyutl -sign -rawin -in assets/sha256sums.txt -inkey key.pem -out assets/sha256sums.txt.sig
          openssl pkeyutl -verify -rawin -in assets/sha256sums.txt -inkey key.pem -sigfile assets/sha256sums.txt.sig
          rm -f key.pem
          echo "$GITHUB_REF_NAME" > assets/version.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: assets/*
          prerelease: ${{ contains(github.ref_name, '-rc') }}
